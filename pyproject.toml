[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_device_bridge_extension"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.21,<3",
    "pyserial>=3.5,<4",
    # the full-screen serial terminal and the environment selector of the device shell
    "textual>=8.2,<9",
    # Starts the terminal of the device shell and of the serial terminal. The frontend
    # names only its command id basic-terminal:launch, so no npm dependency matches
    # this one. Releases before 1.0.7 open a plain shell when the program ends early,
    # releases before 1.0.8 give a launch that their server refuses no readable reason,
    # and releases before 1.0.9 keep the program running when its tab closes.
    "jupyterlab-basic-terminal-extension>=1.0.9,<2"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.scripts]
jupyterlab-device = "jupyterlab_device_bridge_extension.cli:main"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.6,<5",
    "jupyter-builder>=1.2,<2",
]
test = [
    "coverage>=7.16,<8",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pytest-jupyter[server]>=0.11,<1",
    "pyusb>=1.3,<2"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_device_bridge_extension/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_device_bridge_extension/labextension" = "share/jupyter/labextensions/jupyterlab_device_bridge_extension"
"install.json" = "share/jupyter/labextensions/jupyterlab_device_bridge_extension/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
".agents/skills/jupyterlab-device-bridge-extension" = "share/jupyter/agents/skills/jupyterlab-device-bridge-extension"
"resources/envs" = "share/jupyter/agents/skills/jupyterlab-device-bridge-extension/envs"

[tool.hatch.build.hooks.version]
path = "jupyterlab_device_bridge_extension/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_device_bridge_extension/labextension/static/style.js",
    "jupyterlab_device_bridge_extension/labextension/package.json",
]
skip-if-exists = ["jupyterlab_device_bridge_extension/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_device_bridge_extension/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]

[tool.pytest.ini_options]
testpaths = ["jupyterlab_device_bridge_extension"]
