name: Check Release
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
        with:
          python_version: '3.13'
      - name: Check Release
        uses: jupyter-server/jupyter_releaser/.github/actions/check-release@v2
        with:
          # publish-assets uploads the wheel to a test server (pypiserver) inside the
          # runner. That server keeps at most 102400 bytes of one upload in memory and
          # answers "400 Bad Request" (MultipartError: Memory limit reached) above it.
          # The README is the long description of the wheel. With the wheel of 0.6.24
          # the server took a description of up to 46516 characters; the README has
          # 48875. The upload to PyPI itself has no such limit.
          steps_to_skip: "publish-assets"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlab_device_bridge_extension-releaser-dist-${{ github.run_number }}
          path: .jupyter_releaser_checkout/dist
